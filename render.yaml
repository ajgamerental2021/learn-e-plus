databases:
  - name: learn-e-plus-db
    databaseName: learn_e_plus
    user: learn_e_plus
    plan: free

services:
  - type: web
    name: learn-e-plus
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: node node_modules/next/dist/bin/next start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: learn-e-plus-db
          property: connectionString
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
